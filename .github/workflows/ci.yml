name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Check release metadata
        run: bun run release:check

      - name: Run tests
        run: bun run test

      - name: Check generated shell files
        run: |
          bun run sync:profile-shell
          git diff --exit-code public/index.html public/manifest.json

      - name: Build production site
        run: bun run build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser regression suite
        run: bun run test:e2e

      - name: Upload browser failure artifacts
        if: failure() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
