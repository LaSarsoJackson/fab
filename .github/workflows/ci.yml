name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    outputs:
      pages_artifact_name: ${{ steps.pages_artifact_name.outputs.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Check release metadata
        run: bun run release:check

      - name: Run tests
        run: bun run test

      - name: Build production site
        run: bun run build:pages

      - name: Set GitHub Pages artifact name
        id: pages_artifact_name
        if: github.event_name == 'push'
        run: echo "name=github-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          name: ${{ steps.pages_artifact_name.outputs.name }}
          path: dist

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Check ARCE website and app navigation
        run: ARCE_TARGET=github-pages bun run test:arce

      - name: Run browser regression suite
        run: bun run test:e2e

      - name: Upload browser failure artifacts
        if: failure() && !env.ACT
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        with:
          artifact_name: ${{ needs.quality.outputs.pages_artifact_name }}
