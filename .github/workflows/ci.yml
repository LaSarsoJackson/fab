name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Check release metadata
        run: bun run release:check

      - name: Run tests
        run: bun run test

      - name: Build production site
        run: bun run build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          # Reruns share a run id but receive a new attempt number. Keep each
          # Pages artifact unique so deploy-pages cannot see duplicate names.
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser regression suite
        run: bun run test:e2e

      - name: Upload browser failure artifacts
        if: failure() && !env.ACT
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy
    if: github.event_name == 'push'
    needs: quality
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
